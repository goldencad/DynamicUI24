name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore DynamicUI24.slnx
      - name: Build
        run: dotnet build DynamicUI24.slnx -c Release --no-restore
      - name: Test
        run: dotnet test DynamicUI24.slnx -c Release --no-build
